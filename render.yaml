services:
  - type: web
    name: rpw-booster
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rpw-booster-db
          property: connectionString

databases:
  - name: rpw-booster-db
    databaseName: rpw_booster
    plan: free
